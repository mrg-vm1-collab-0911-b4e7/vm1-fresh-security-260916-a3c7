conflict_resolvers:
  - paths:
      - resolver.txt
    strategy: theirs
queue_rules:
  - name: vm1-mergemethod-revoke-260928
    merge_method: merge
    batch_size: 1
    queue_conditions:
      - base = vm1-mergemethod-base-260928
      - title = VM1_MERGEMETHOD_REVOKE_260928
    merge_conditions:
      - check-success = vm1-mergemethod-final-gate-260928

  - name: vm1-conflict-resolver-260930
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 60 seconds
    queue_conditions:
      - base = vm1-conflict-base-260930
      - title ~= ^VM1_CR_260930_
    merge_conditions:
      - check-success = vm1-conflict-never-260930

merge_protections_settings:
  reporting_method: check-runs
  post_comment: false

merge_protections:
  - name: vm1-milestone-revocation-261001
    if:
      - title = VM1_MILESTONE_REVOKE_261001
    success_conditions:
      - milestone = VM1_SECURITY_APPROVED_261001

pull_request_rules:
  - name: VM1 fresh baseline
    conditions:
      - -draft
    actions: {}

  - name: VM1 merge method revoke probe
    conditions:
      - base = vm1-mergemethod-base-260928
      - title = VM1_MERGEMETHOD_REVOKE_260928
      - author = livastic-vm1-secondary
    actions:
      queue:
        name: vm1-mergemethod-revoke-260928
