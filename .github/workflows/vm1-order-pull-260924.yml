name: VM1 older-created delayed success
on:
  pull_request:
    branches:
      - vm1-order-base-260924
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  ordering:
    if: startsWith(github.event.pull_request.title, 'VM1_CHECK_COMPLETION_ORDER_')
    name: vm1-ordering-gate
    runs-on: ubuntu-latest
    steps:
      - name: Keep older generation pending
        run: sleep 120
      - name: Complete older generation successfully
        run: echo VM1_OLDER_CREATED_LATE_SUCCESS
