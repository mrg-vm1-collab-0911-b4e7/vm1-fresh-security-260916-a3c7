name: VM1 newer-created fast failure
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  ordering:
    if: github.event.pull_request.base.ref == 'vm1-order-base-260924' && startsWith(github.event.pull_request.title, 'VM1_CHECK_COMPLETION_ORDER_')
    name: vm1-ordering-gate
    runs-on: ubuntu-latest
    steps:
      - name: Fail newer generation
        run: |
          echo VM1_NEWER_CREATED_EARLY_FAILURE
          exit 1
